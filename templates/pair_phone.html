<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fb">
  <title>Pair this iPhone · HomeCloud</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="phone-pair-shell">
    <section class="phone-pair-card">
      <div class="lock-orb">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3 5.5 5.7v5.2c0 4.5 2.8 8.6 6.5 10.1 3.7-1.5 6.5-5.6 6.5-10.1V5.7L12 3Z"></path>
          <path d="m9.2 12.2 1.8 1.8 4-4.3"></path>
        </svg>
      </div>

      <div class="eyebrow">HOMECLOUD PAIRING</div>
      <h1>Allow this iPhone?</h1>
      <p>
        Pairing gives this browser permission to browse, upload,
        download, and delete files in your HomeCloud.
      </p>

      <button id="pairPhoneButton" class="phone-pair-button" type="button">
        Pair this iPhone
      </button>

      <div id="phonePairMessage" class="phone-pair-message hidden"></div>

      <p class="phone-pair-footnote">
        Only continue if you personally created the QR code on your Mac.
      </p>
    </section>
  </main>

  <script>
    window.HOMECLOUD_PAIR_SECRET = {{ secret|tojson }};
  </script>
  <script src="{{ url_for('static', filename='js/pair_phone.js') }}"></script>
</body>
</html>
